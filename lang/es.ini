plugin.name = Escalado de enemigos
plugin.description = Los enemigos y jefes por debajo del nivel de tu grupo suben a ese nivel, con estadísticas, EXP y guiles acordes. Los enemigos más fuertes se quedan como están.
Normal.label = Escalar enemigos normales
Normal.help = Los enemigos normales por debajo del nivel del grupo suben a ese nivel.
Bosses.label = Escalar jefes
Bosses.help = Los jefes por debajo del nivel del grupo suben a ese nivel: jefes de la historia y secundarios, enemigos temibles, invocaciones, las 12 armas y otros superjefes.
Basis.label = Nivel del grupo
Basis.help = A qué nivel del grupo actual suben los enemigos.
Basis.choice.1 = Más alto
Basis.choice.2 = Media
Basis.choice.3 = Más bajo
Offset.label = Ajuste de nivel
Offset.help = Se suma al nivel del grupo: con +3, cada enemigo tiene al menos 3 niveles más que tú.
Rewards.label = Escalar EXP y guiles
Rewards.help = Un enemigo escalado también da la EXP y los guiles de su nuevo nivel. Los objetos que suelta no cambian.
