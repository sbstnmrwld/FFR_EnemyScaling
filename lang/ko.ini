plugin.name = 적 레벨 조정
plugin.description = 파티 레벨보다 낮은 적과 보스를 그 레벨까지 올리고, 능력치·EXP·길도 그에 맞춥니다. 더 강한 적은 그대로입니다.
Normal.label = 일반 적 조정
Normal.help = 파티 레벨보다 낮은 일반 적을 그 레벨까지 올립니다.
Bosses.label = 보스 조정
Bosses.help = 파티 레벨보다 낮은 보스를 그 레벨까지 올립니다: 스토리·서브 이벤트 보스, 강적, 소환수, 12무구 및 기타 히든 보스.
Basis.label = 파티 레벨
Basis.help = 현재 파티의 어느 레벨에 적을 맞출지 정합니다.
Basis.choice.1 = 최고
Basis.choice.2 = 평균
Basis.choice.3 = 최저
Offset.label = 레벨 보정
Offset.help = 파티 레벨에 더해집니다: +3이면 모든 적이 최소 3레벨 위가 됩니다.
Rewards.label = EXP와 길 조정
Rewards.help = 레벨이 오른 적은 새 레벨의 EXP와 길도 줍니다. 아이템 드롭은 그대로입니다.
