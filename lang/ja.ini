plugin.name = 敵レベル調整
plugin.description = パーティのレベルより低い敵とボスをそのレベルまで引き上げ、能力値・EXP・ギルもそれに合わせます。より強い敵はそのままです。
Normal.label = 通常の敵を調整
Normal.help = パーティのレベルより低い通常の敵をそのレベルまで引き上げます。
Bosses.label = ボスを調整
Bosses.help = パーティのレベルより低いボスをそのレベルまで引き上げます：ストーリー・サブイベントのボス、強敵、召喚獣、十二武具、その他の裏ボス。
Basis.label = パーティのレベル
Basis.help = 現在のパーティのどのレベルに敵を合わせるか。
Basis.choice.1 = 最高
Basis.choice.2 = 平均
Basis.choice.3 = 最低
Offset.label = レベル補正
Offset.help = パーティのレベルに加算されます：+3 ならすべての敵が少なくとも 3 レベル上になります。
Rewards.label = EXP とギルを調整
Rewards.help = 引き上げた敵は新しいレベルの EXP とギルも落とします。アイテムのドロップは変わりません。
