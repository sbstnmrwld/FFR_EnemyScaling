plugin.name = 敵人等級調整
plugin.description = 低於隊伍等級的敵人和頭目會提升到該等級，能力值、EXP 和基爾也隨之調整。更強的敵人維持不變。
Normal.label = 調整普通敵人
Normal.help = 低於隊伍等級的普通敵人會提升到該等級。
Bosses.label = 調整頭目
Bosses.help = 低於隊伍等級的頭目會提升到該等級：主線和支線頭目、強敵、召喚獸、十二武具及其他隱藏頭目。
Basis.label = 隊伍等級
Basis.help = 敵人提升到目前隊伍的哪個等級。
Basis.choice.1 = 最高
Basis.choice.2 = 平均
Basis.choice.3 = 最低
Offset.label = 等級偏移
Offset.help = 加到隊伍等級上：+3 時所有敵人至少比你高 3 級。
Rewards.label = 調整 EXP 和基爾
Rewards.help = 提升後的敵人也會給予新等級的 EXP 和基爾。掉落道具不變。
