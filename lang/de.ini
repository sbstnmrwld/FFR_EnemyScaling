plugin.name = Gegner-Skalierung
plugin.description = Gegner und Bosse unter dem Level deiner Party werden auf dieses Level angehoben, mit passenden Werten, EXP und Gil. Stärkere Gegner bleiben, wie sie sind.
Normal.label = Normale Gegner skalieren
Normal.help = Normale Gegner unter dem Party-Level werden auf dieses Level angehoben.
Bosses.label = Bosse skalieren
Bosses.help = Bosse unter dem Party-Level werden auf dieses Level angehoben: Story- und Nebenbosse, starke Gegner, Beschwörungen, die 12 Waffen und andere Superbosse.
Basis.label = Party-Level
Basis.help = Auf welches Level der aktuellen Party die Gegner angehoben werden.
Basis.choice.1 = Höchstes
Basis.choice.2 = Durchschnitt
Basis.choice.3 = Niedrigstes
Offset.label = Level-Versatz
Offset.help = Wird zum Party-Level addiert: Mit +3 sind alle Gegner mindestens 3 Level über dir.
Rewards.label = EXP und Gil skalieren
Rewards.help = Ein angehobener Gegner gibt auch die EXP und das Gil seines neuen Levels. Item-Beute bleibt gleich.
