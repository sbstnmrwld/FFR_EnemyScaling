plugin.name = Mise à niveau des ennemis
plugin.description = Les ennemis et boss d'un niveau inférieur à celui de votre groupe sont élevés à ce niveau, avec statistiques, EXP et gils en conséquence. Les ennemis plus forts restent inchangés.
Normal.label = Ajuster les ennemis normaux
Normal.help = Les ennemis normaux d'un niveau inférieur à celui du groupe sont élevés à ce niveau.
Bosses.label = Ajuster les boss
Bosses.help = Les boss d'un niveau inférieur à celui du groupe sont élevés à ce niveau : boss de l'histoire et des quêtes annexes, ennemis redoutables, invocations, les 12 armes et autres superboss.
Basis.label = Niveau du groupe
Basis.help = Le niveau du groupe actuel auquel les ennemis sont élevés.
Basis.choice.1 = Le plus haut
Basis.choice.2 = Moyenne
Basis.choice.3 = Le plus bas
Offset.label = Décalage de niveau
Offset.help = Ajouté au niveau du groupe : avec +3, chaque ennemi a au moins 3 niveaux de plus que vous.
Rewards.label = Ajuster EXP et gils
Rewards.help = Un ennemi élevé donne aussi l'EXP et les gils de son nouveau niveau. Les objets obtenus ne changent pas.
