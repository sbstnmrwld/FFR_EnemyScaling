plugin.name = 敌人等级调整
plugin.description = 低于队伍等级的敌人和首领会提升到该等级，能力值、EXP 和金币也随之调整。更强的敌人保持不变。
Normal.label = 调整普通敌人
Normal.help = 低于队伍等级的普通敌人会提升到该等级。
Bosses.label = 调整首领
Bosses.help = 低于队伍等级的首领会提升到该等级：主线和支线首领、强敌、召唤兽、十二武具及其他隐藏首领。
Basis.label = 队伍等级
Basis.help = 敌人提升到当前队伍的哪个等级。
Basis.choice.1 = 最高
Basis.choice.2 = 平均
Basis.choice.3 = 最低
Offset.label = 等级偏移
Offset.help = 加到队伍等级上：+3 时所有敌人至少比你高 3 级。
Rewards.label = 调整 EXP 和金币
Rewards.help = 提升后的敌人也会给予新等级的 EXP 和金币。掉落道具不变。
